<svg xmlns="http://www.w3.org/2000/svg" viewBox="-14 -14 168 186" width="168" height="186">
  <!-- Bohlam ide: mengantuk → berkedip-kedip → "TING!" menyala memantul, mata terbuka, sinar memancar -->
  <style>
    .bulb { transform-box: view-box; transform-origin: 70px 150px; animation: bulb 4.4s infinite; }
    .glass { animation: glass 4.4s infinite; }
    .halo { transform-box: view-box; transform-origin: 70px 66px; animation: halo 4.4s infinite; }
    .rays { transform-box: view-box; transform-origin: 70px 66px; animation: rays 4.4s infinite; }
    .sleep { animation: sleep 4.4s infinite; }
    .awake { animation: awake 4.4s infinite; }
    @keyframes bulb {
      0% { transform: rotate(-3deg); animation-timing-function: ease-in-out; }
      18% { transform: rotate(3deg); animation-timing-function: ease-in-out; }
      34% { transform: rotate(-2deg) scale(1, .96); animation-timing-function: ease-out; }
      42% { transform: scale(.9, 1.14) translateY(-6px); animation-timing-function: ease-out; }
      48% { transform: scale(1.1, .92); animation-timing-function: ease-in-out; }
      54% { transform: scale(.97, 1.04); animation-timing-function: ease-in-out; }
      60% { transform: rotate(4deg); animation-timing-function: ease-in-out; }
      74% { transform: rotate(-4deg); animation-timing-function: ease-in-out; }
      88% { transform: rotate(2deg); animation-timing-function: ease-in-out; }
      100% { transform: rotate(-3deg); }
    }
    @keyframes glass {
      0%, 30%, 33%, 36%, 92%, 100% { fill: #f3ead8; }
      31.5%, 34.5%, 40%, 88% { fill: #ffd23f; }
    }
    @keyframes halo {
      0%, 38%, 92%, 100% { opacity: 0; transform: scale(.6); }
      46% { opacity: .55; transform: scale(1.15); }
      56%, 86% { opacity: .35; transform: scale(1); }
    }
    @keyframes rays {
      0%, 39%, 92%, 100% { opacity: 0; transform: scale(.55); }
      46% { opacity: 1; transform: scale(1.12); animation-timing-function: ease-in-out; }
      54% { transform: scale(.96); animation-timing-function: ease-in-out; }
      66% { opacity: 1; transform: scale(1.04) rotate(4deg); animation-timing-function: ease-in-out; }
      78% { transform: scale(.98) rotate(-3deg); }
      88% { opacity: 1; transform: scale(1); }
    }
    @keyframes sleep { 0%, 39%, 92%, 100% { opacity: 1; } 40%, 90% { opacity: 0; } }
    @keyframes awake { 0%, 39%, 92%, 100% { opacity: 0; } 40%, 90% { opacity: 1; } }
  </style>
  <circle class="halo" cx="70" cy="66" r="56" fill="#ffd23f"/>
  <g class="rays" stroke="#f46c0c" stroke-width="7" stroke-linecap="round">
    <path d="M70 4 V18"/><path d="M20 22 L30 32"/><path d="M120 22 L110 32"/><path d="M4 66 H18"/><path d="M136 66 H122"/>
  </g>
  <g class="bulb">
    <path class="glass" d="M70 26 C46 26 34 44 34 62 C34 78 46 86 50 96 L50 108 L90 108 L90 96 C94 86 106 78 106 62 C106 44 94 26 70 26 Z" fill="#f3ead8" stroke="#3a1f15" stroke-width="5" stroke-linejoin="round"/>
    <path d="M48 50 Q52 38 64 36" stroke="#fff" stroke-width="6" stroke-linecap="round" fill="none"/>
    <g class="sleep" stroke="#3a1f15" stroke-width="4" stroke-linecap="round" fill="none">
      <path d="M53 66 Q58 70 63 66"/><path d="M77 66 Q82 70 87 66"/>
    </g>
    <g class="awake">
      <ellipse cx="58" cy="64" rx="5" ry="7" fill="#3a1f15"/><ellipse cx="82" cy="64" rx="5" ry="7" fill="#3a1f15"/>
      <circle cx="60" cy="61" r="2" fill="#fff"/><circle cx="84" cy="61" r="2" fill="#fff"/>
      <path d="M62 78 Q70 86 78 78" stroke="#3a1f15" stroke-width="4" stroke-linecap="round" fill="#f46c0c"/>
    </g>
    <rect x="50" y="106" width="40" height="12" rx="4" fill="#9a8d86" stroke="#3a1f15" stroke-width="4"/>
    <rect x="52" y="116" width="36" height="12" rx="4" fill="#bdb2ab" stroke="#3a1f15" stroke-width="4"/>
    <path d="M60 128 H80 L76 138 H64 Z" fill="#3a1f15"/>
  </g>
</svg>
