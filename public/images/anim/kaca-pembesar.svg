<svg xmlns="http://www.w3.org/2000/svg" viewBox="-14 -16 190 190" width="190" height="190">
  <!-- Kaca pembesar detektif: bergerak-berhenti mencari (dengan pantulan), mata di lensa ikut melirik & berkedip -->
  <style>
    .scan { transform-box: view-box; transform-origin: 64px 64px; animation: scan 5s infinite; }
    .pupil { animation: look 5s infinite; }
    .eye { transform-box: view-box; transform-origin: 64px 64px; animation: blink 5s infinite; }
    .glint { transform-box: view-box; transform-origin: 92px 44px; animation: glint 5s infinite; }
    @keyframes scan {
      0% { transform: rotate(-6deg); animation-timing-function: cubic-bezier(.5,0,.3,1.6); }
      14%, 30% { transform: translate(16px, -8px) rotate(8deg); animation-timing-function: cubic-bezier(.5,0,.3,1.6); }
      44%, 60% { transform: translate(-14px, 4px) rotate(-8deg); animation-timing-function: cubic-bezier(.5,0,.3,1.6); }
      74%, 88% { transform: translate(4px, -12px) rotate(3deg); animation-timing-function: cubic-bezier(.5,0,.3,1.4); }
      100% { transform: rotate(-6deg); }
    }
    @keyframes look {
      0% { transform: none; animation-timing-function: ease-out; }
      10%, 32% { transform: translate(9px, -5px); animation-timing-function: ease-out; }
      40%, 62% { transform: translate(-9px, 3px); animation-timing-function: ease-out; }
      70%, 90% { transform: translate(2px, -8px); animation-timing-function: ease-out; }
      100% { transform: none; }
    }
    @keyframes blink {
      0%, 35%, 41%, 100% { transform: scaleY(1); }
      38% { transform: scaleY(.08); }
    }
    @keyframes glint {
      0%, 16%, 30%, 100% { opacity: 0; transform: scale(.2) rotate(0); }
      21% { opacity: 1; transform: scale(1.2) rotate(45deg); }
      26% { opacity: 1; transform: scale(.9) rotate(90deg); }
    }
  </style>
  <g class="scan">
    <path d="M92 92 L134 134" stroke="#3a1f15" stroke-width="20" stroke-linecap="round"/>
    <path d="M92 92 L134 134" stroke="#4a2b52" stroke-width="12" stroke-linecap="round"/>
    <path d="M104 104 L112 112" stroke="#fbc045" stroke-width="12"/>
    <circle cx="64" cy="64" r="44" fill="#d6f0ff" stroke="#3a1f15" stroke-width="5"/>
    <g class="eye">
      <ellipse cx="64" cy="64" rx="26" ry="22" fill="#fff" stroke="#3a1f15" stroke-width="4"/>
      <g class="pupil">
        <circle cx="64" cy="64" r="12" fill="#3a1f15"/>
        <circle cx="68" cy="59" r="4" fill="#fff"/>
      </g>
    </g>
    <circle cx="64" cy="64" r="44" fill="none" stroke="#4a2b52" stroke-width="10"/>
    <circle cx="64" cy="64" r="49" fill="none" stroke="#3a1f15" stroke-width="3"/>
    <path d="M36 50 Q42 34 58 30" stroke="#fff" stroke-width="6" stroke-linecap="round" fill="none" opacity=".9"/>
    <path class="glint" d="M92 30 l4 10 10 4 -10 4 -4 10 -4 -10 -10 -4 10 -4z" fill="#fff" stroke="#3a1f15" stroke-width="2"/>
  </g>
</svg>
