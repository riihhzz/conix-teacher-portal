<svg xmlns="http://www.w3.org/2000/svg" viewBox="-20 -10 300 240" width="300" height="240">
  <!-- Konfeti: jatuh sambil melayang ke kiri-kanan (sway) dan berkibar seperti kertas -->
  <style>
    .p { animation: fall 3.2s linear infinite; }
    .w { transform-box: fill-box; transform-origin: center; animation: sway 1.2s ease-in-out infinite alternate; }
    .f { transform-box: fill-box; transform-origin: center; animation: flutter .7s ease-in-out infinite alternate; }
    @keyframes fall { 0% { transform: translateY(-40px); opacity: 0; } 10%, 85% { opacity: 1; } 100% { transform: translateY(200px); opacity: 0; } }
    @keyframes sway { from { transform: translateX(-10px) rotate(-25deg); } to { transform: translateX(10px) rotate(25deg); } }
    @keyframes flutter { from { transform: scaleY(1); } to { transform: scaleY(.25); } }
  </style>
  <g class="p" style="animation-delay:0s"><g class="w"><rect class="f" x="20" y="0" width="12" height="18" rx="3" fill="#f46c0c" stroke="#3a1f15" stroke-width="2"/></g></g>
  <g class="p" style="animation-delay:.6s;animation-duration:3.6s"><g class="w" style="animation-delay:-.4s"><rect class="f" x="60" y="0" width="10" height="16" rx="3" fill="#fbc045" stroke="#3a1f15" stroke-width="2"/></g></g>
  <g class="p" style="animation-delay:1.1s"><g class="w" style="animation-delay:-.8s"><circle cx="100" cy="6" r="7" fill="#30c000" stroke="#3a1f15" stroke-width="2"/></g></g>
  <g class="p" style="animation-delay:.3s;animation-duration:2.9s"><g class="w" style="animation-delay:-.2s"><rect class="f" x="140" y="0" width="12" height="18" rx="3" fill="#4fb3ff" stroke="#3a1f15" stroke-width="2" style="animation-delay:-.3s"/></g></g>
  <g class="p" style="animation-delay:1.5s"><g class="w" style="animation-delay:-.6s"><path class="f" d="M180 0 l8 14 -16 0z" fill="#ff5a8a" stroke="#3a1f15" stroke-width="2"/></g></g>
  <g class="p" style="animation-delay:.9s;animation-duration:3.4s"><g class="w" style="animation-delay:-1s"><rect class="f" x="215" y="0" width="10" height="16" rx="3" fill="#f46c0c" stroke="#3a1f15" stroke-width="2" style="animation-delay:-.5s"/></g></g>
  <g class="p" style="animation-delay:1.9s"><g class="w" style="animation-delay:-.1s"><circle cx="40" cy="6" r="6" fill="#4fb3ff" stroke="#3a1f15" stroke-width="2"/></g></g>
  <g class="p" style="animation-delay:2.2s;animation-duration:3s"><g class="w" style="animation-delay:-.7s"><rect class="f" x="120" y="0" width="10" height="15" rx="3" fill="#fbc045" stroke="#3a1f15" stroke-width="2" style="animation-delay:-.2s"/></g></g>
  <g class="p" style="animation-delay:2.6s"><g class="w" style="animation-delay:-.9s"><path class="f" d="M235 0 l8 14 -16 0z" fill="#30c000" stroke="#3a1f15" stroke-width="2"/></g></g>
</svg>
