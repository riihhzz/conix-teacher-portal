<svg xmlns="http://www.w3.org/2000/svg" viewBox="-42 -2 214 174" width="214" height="174">
  <!-- Label harga: tersentak lalu berayun meredam (bandul), harga naik 120k → 150k -->
  <style>
    .swing { transform-box: view-box; transform-origin: 65px 8px; animation: swing 4.4s infinite; }
    .old { animation: old 4.4s infinite; }
    .new { animation: new 4.4s infinite; }
    .up { transform-box: view-box; transform-origin: 90px 134px; animation: up 4.4s infinite; }
    @keyframes swing {
      0% { transform: rotate(0); animation-timing-function: cubic-bezier(.3,0,.2,1); }
      8% { transform: rotate(-24deg); animation-timing-function: ease-in-out; }
      20% { transform: rotate(17deg); animation-timing-function: ease-in-out; }
      32% { transform: rotate(-11deg); animation-timing-function: ease-in-out; }
      43% { transform: rotate(7deg); animation-timing-function: ease-in-out; }
      53% { transform: rotate(-4deg); animation-timing-function: ease-in-out; }
      62% { transform: rotate(2deg); animation-timing-function: ease-in-out; }
      70%, 100% { transform: rotate(0); }
    }
    @keyframes old {
      0%, 6% { opacity: 1; transform: none; }
      12%, 92% { opacity: 0; transform: translateY(-14px); }
      100% { opacity: 1; transform: none; }
    }
    @keyframes new {
      0%, 8% { opacity: 0; transform: translateY(14px); }
      14% { opacity: 1; transform: translateY(-3px); }
      18%, 90% { opacity: 1; transform: none; }
      96%, 100% { opacity: 0; transform: none; }
    }
    @keyframes up {
      0%, 12% { opacity: 0; transform: scale(0); }
      18% { opacity: 1; transform: translateY(-6px) scale(1.3); }
      24%, 88% { opacity: 1; transform: none; }
      94%, 100% { opacity: 0; transform: scale(0); }
    }
  </style>
  <circle cx="65" cy="8" r="6" fill="#3a1f15"/>
  <g class="swing">
    <path d="M65 8 L65 40" stroke="#3a1f15" stroke-width="4"/>
    <path d="M30 52 L65 34 L100 52 V150 A10 10 0 0 1 90 160 H40 A10 10 0 0 1 30 150 Z" fill="#fbc045" stroke="#3a1f15" stroke-width="5" stroke-linejoin="round"/>
    <circle cx="65" cy="54" r="8" fill="#fefaf1" stroke="#3a1f15" stroke-width="4"/>
    <text x="65" y="94" text-anchor="middle" font-family="Arial Black, Arial, sans-serif" font-weight="900" font-size="22" fill="#3a1f15">Rp</text>
    <text class="old" x="65" y="124" text-anchor="middle" font-family="Arial Black, Arial, sans-serif" font-weight="900" font-size="20" fill="#3a1f15">120k</text>
    <text class="new" x="65" y="124" text-anchor="middle" font-family="Arial Black, Arial, sans-serif" font-weight="900" font-size="20" fill="#d62828">150k</text>
    <path class="up" d="M82 146 L90 132 L98 146 Z" fill="#f46c0c" stroke="#3a1f15" stroke-width="3" stroke-linejoin="round"/>
  </g>
</svg>
