<svg xmlns="http://www.w3.org/2000/svg" viewBox="-34 -48 268 180" width="268" height="180">
  <!-- Stempel "KASUS TERPECAHKAN": terangkat (ancang-ancang) → menghantam → garis benturan → memantul pelan -->
  <style>
    .stamp { transform-box: view-box; transform-origin: 100px 55px; animation: stamp 4s infinite; }
    .hit { transform-box: view-box; transform-origin: 100px 55px; animation: hit 4s infinite; }
    @keyframes stamp {
      0%, 6% { opacity: 0; transform: translateY(-10px) scale(1.15) rotate(-12deg); animation-timing-function: ease-out; }
      14% { opacity: 1; transform: translateY(-18px) scale(1.28) rotate(-14deg); animation-timing-function: cubic-bezier(.7,0,1,.6); }
      22% { transform: scale(.9, .84) rotate(-8deg); animation-timing-function: ease-out; }
      28% { transform: scale(1.05, 1.08) rotate(-9deg); animation-timing-function: ease-in-out; }
      34% { transform: scale(.99) rotate(-8deg); animation-timing-function: ease-in-out; }
      40%, 86% { opacity: 1; transform: rotate(-8deg); }
      94%, 100% { opacity: 0; transform: rotate(-8deg) scale(.96); }
    }
    @keyframes hit {
      0%, 21% { opacity: 0; transform: scale(.7); }
      24% { opacity: 1; transform: scale(.9); animation-timing-function: ease-out; }
      36%, 100% { opacity: 0; transform: scale(1.25); }
    }
  </style>
  <g class="hit" stroke="#3a1f15" stroke-width="5" stroke-linecap="round">
    <path d="M-2 20 L10 28"/><path d="M-4 60 H10"/><path d="M-2 98 L10 90"/>
    <path d="M202 20 L190 28"/><path d="M204 60 H190"/><path d="M202 98 L190 90"/>
  </g>
  <g class="stamp">
    <rect x="12" y="16" width="176" height="78" rx="12" fill="#fefaf1" stroke="#d62828" stroke-width="6"/>
    <rect x="22" y="26" width="156" height="58" rx="8" fill="none" stroke="#d62828" stroke-width="3" stroke-dasharray="7 5"/>
    <text x="100" y="52" text-anchor="middle" font-family="Arial Black, Arial, sans-serif" font-weight="900" font-size="20" fill="#d62828">KASUS</text>
    <text x="100" y="76" text-anchor="middle" font-family="Arial Black, Arial, sans-serif" font-weight="900" font-size="17" fill="#d62828">TERPECAHKAN</text>
  </g>
</svg>
