<svg xmlns="http://www.w3.org/2000/svg" viewBox="-24 -30 158 166" width="158" height="166">
  <!-- Gelembung "?": muncul memantul (squash & stretch), tanda tanya menyusul melompat lalu mengangguk -->
  <style>
    .pop { transform-box: view-box; transform-origin: 24px 104px; animation: pop 4s infinite; }
    .q { transform-box: view-box; transform-origin: 55px 70px; animation: q 4s infinite; }
    @keyframes pop {
      0% { transform: scale(0); animation-timing-function: cubic-bezier(.2,.7,.4,1); }
      8% { transform: scale(.88, 1.16); animation-timing-function: ease-in-out; }
      14% { transform: scale(1.1, .92); animation-timing-function: ease-in-out; }
      20% { transform: scale(.97, 1.03); animation-timing-function: ease-in-out; }
      26%, 84% { transform: none; animation-timing-function: ease-in; }
      90% { transform: scale(1.08, .94); animation-timing-function: ease-in; }
      100% { transform: scale(0); }
    }
    @keyframes q {
      0%, 10% { transform: translateY(16px) scale(.4); opacity: 0; animation-timing-function: cubic-bezier(.2,.7,.4,1); }
      18% { transform: translateY(-12px) scale(.9, 1.15); opacity: 1; animation-timing-function: ease-in; }
      25% { transform: translateY(0) scale(1.15, .85); animation-timing-function: ease-out; }
      31% { transform: scale(.96, 1.05); animation-timing-function: ease-in-out; }
      36% { transform: none; animation-timing-function: ease-in-out; }
      50% { transform: rotate(-14deg); animation-timing-function: ease-in-out; }
      58% { transform: rotate(10deg); animation-timing-function: ease-in-out; }
      65% { transform: rotate(-4deg); animation-timing-function: ease-in-out; }
      72%, 86% { transform: none; opacity: 1; }
      92%, 100% { transform: scale(0); opacity: 0; }
    }
  </style>
  <g class="pop">
    <path d="M18 10 H92 A12 12 0 0 1 104 22 V70 A12 12 0 0 1 92 82 H44 L22 104 L26 82 H18 A12 12 0 0 1 6 70 V22 A12 12 0 0 1 18 10 Z" fill="#fefaf1" stroke="#3a1f15" stroke-width="5" stroke-linejoin="round"/>
    <g class="q">
      <text x="55" y="70" text-anchor="middle" font-family="Arial Black, Arial, sans-serif" font-weight="900" font-size="58" fill="#f46c0c" stroke="#3a1f15" stroke-width="2.5">?</text>
    </g>
  </g>
</svg>
