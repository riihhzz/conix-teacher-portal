<svg xmlns="http://www.w3.org/2000/svg" viewBox="-8 -8 76 76" width="76" height="76">
  <!-- Kilau: menyusut (ancang-ancang) → meletup memutar → meredup; bintang kecil menyusul -->
  <style>
    .s { transform-box: view-box; transform-origin: 26px 30px; animation: tw 2.4s infinite; }
    .t { transform-box: view-box; transform-origin: 50px 10px; animation: tw 2.4s .35s infinite; }
    @keyframes tw {
      0% { transform: scale(.35); opacity: .35; animation-timing-function: ease-in; }
      20% { transform: scale(.22) rotate(-10deg); opacity: .5; animation-timing-function: cubic-bezier(.2,.8,.3,1.4); }
      40% { transform: scale(1.1) rotate(60deg); opacity: 1; animation-timing-function: ease-in-out; }
      55% { transform: scale(.92) rotate(80deg); opacity: 1; animation-timing-function: ease-in-out; }
      70% { transform: scale(1) rotate(90deg); opacity: 1; animation-timing-function: ease-in; }
      100% { transform: scale(.35) rotate(90deg); opacity: .35; }
    }
  </style>
  <path class="s" d="M26 6 C28 22 32 26 48 30 C32 34 28 38 26 54 C24 38 20 34 4 30 C20 26 24 22 26 6 Z" fill="#ffd23f" stroke="#3a1f15" stroke-width="3" stroke-linejoin="round"/>
  <path class="t" d="M50 2 C51 8 52 9 58 10 C52 11 51 12 50 18 C49 12 48 11 42 10 C48 9 49 8 50 2 Z" fill="#fff" stroke="#3a1f15" stroke-width="2" stroke-linejoin="round"/>
</svg>
