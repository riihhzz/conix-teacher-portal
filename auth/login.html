<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Masuk ke CONIX Teacher Portal." />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="stylesheet" href="/src/styles/main.css" />
    <title>Masuk · CONIX Teacher Portal</title>
  </head>
  <body class="overflow-x-hidden">
    <header class="public-header">
      <div class="page flex items-center gap-3 py-3 pb-3">
        <a href="../index.html" aria-label="CONIX — Beranda" class="transition hover:scale-[1.03]">
          <img src="/images/brand/logotype.png" alt="CONIX" class="h-10 w-auto sm:h-12" />
        </a>
        <a href="../index.html" class="nav-link ml-auto">← Beranda</a>
        <a href="register.html" class="btn-chunky btn-chunky-light btn-chunky-sm" data-keep-query>Daftar</a>
      </div>
    </header>

    <main class="page grid min-h-[calc(100vh-76px)] overflow-x-clip max-w-300 items-center gap-10 py-10 lg:grid-cols-2 lg:gap-16">
      <!-- Ilustrasi -->
      <section class="relative mx-auto hidden aspect-square w-full max-w-115 lg:block" aria-hidden="true">
        <div class="pop-spring absolute inset-[10%] rounded-full border-3 border-ink bg-linear-to-b from-sun to-sun-light shadow-card"></div>
        <div class="spin-slow absolute inset-[4%] rounded-full border-3 border-dashed border-ink/25" style="--dur: 60s"></div>
        <div class="scatter absolute top-[12%] left-[26%] h-[62%] w-[48%]" style="--in: 0.1s">
          <div data-nomi-rig data-mood="normal"></div>
        </div>
        <div class="scatter absolute top-[0%] left-[0%] w-[28%]" style="--in: 0.3s; --fx: 120px; --fy: 140px">
          <img src="/images/anim/kaca-pembesar.svg" alt="" class="w-full" />
        </div>
        <div class="scatter absolute top-[40%] right-[-5%] w-[22%]" style="--in: 0.45s; --fx: -150px; --fy: 0px">
          <img src="/images/anim/koin.svg" alt="" class="w-full" />
        </div>
        <div class="scatter absolute bottom-[2%] left-[10%] w-[19%]" style="--in: 0.6s; --fx: 110px; --fy: -140px">
          <img src="/images/badges/lencana-1.png" alt="" class="float w-full" style="--r: 5deg; --delay: -3s" />
        </div>
        <img src="/images/anim/kilau.svg" alt="" class="absolute right-[18%] bottom-[14%] w-[9%]" />
        <div class="pop-spring absolute top-[6%] right-[4%] rounded-2xl border-3 border-ink bg-paper px-3 py-1.5 text-sm font-extrabold shadow-[0_4px_0_var(--color-ink)]" style="--in: 0.9s">
          Selamat datang lagi! 👋
        </div>
      </section>

      <!-- Form -->
      <section class="pop-spring mx-auto w-full max-w-md" style="--in: 0.15s">
        <p role="status" class="mb-4 flex items-center gap-3 rounded-[14px] border-3 border-ink bg-sun-light px-4 py-3 font-semibold" data-notice hidden>
          <img src="/images/mascot/nomi.png" alt="" class="h-10 w-auto" />
          <span data-notice-text></span>
        </p>

        <form novalidate class="space-y-4 rounded-[23px] border-4 border-ink bg-cream p-6 shadow-soft sm:p-8" data-auth-form>
          <header>
            <h1 class="text-3xl font-extrabold">Masuk</h1>
            <p class="font-body text-bark">Kelola materi dan misi kelas Anda.</p>
          </header>
          <div>
            <label class="label" for="login-email">Email</label>
            <input class="input" id="login-email" name="email" type="email" autocomplete="email" required placeholder="nama@sekolah.sch.id" />
          </div>
          <div>
            <label class="label" for="login-password">Password</label>
            <div class="relative">
              <input class="input pr-14" id="login-password" name="password" type="password" autocomplete="current-password" required placeholder="••••••••" />
              <button type="button" class="btn-icon absolute top-1/2 right-2 -translate-y-1/2" data-toggle-password aria-label="Tampilkan password"><svg viewBox="0 0 24 24" class="size-6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg></button>
            </div>
          </div>
          <p class="field-error" data-error hidden></p>
          <button class="btn-chunky btn-chunky-brand w-full">Masuk</button>
          <p class="text-center font-body">
            Belum punya akun?
            <a href="register.html" class="font-sans font-bold text-brand underline-offset-4 hover:underline" data-keep-query>Daftar sekarang</a>
          </p>
        </form>
      </section>
    </main>

    <script type="module" src="/src/js/pages/login.js"></script>
  </body>
</html>
